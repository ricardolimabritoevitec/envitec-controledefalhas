<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnvitecEnergy | Controle de Falhas</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
.manage-local-header:hover { background: #e6f9ed !important; }

:root{--bg:#f4f8f5;--card:#ffffff;--text:#0f1f17;--muted:#5b6b62;--accent:#0d9669;--accent-soft:rgba(13,150,105,.12);--border:rgba(15,31,23,.1)}
*{box-sizing:border-box}
body{margin:0;font-family:"Figtree",sans-serif;background:var(--bg);color:var(--text)}
h1,h3,p{margin:0}button,input,select,textarea{font-family:inherit;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid;white-space:nowrap;}
.pill .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor}
.pill-ok{background:rgba(13,150,105,.12);color:#0a7a55;border-color:rgba(13,150,105,.3)}
.pill-bad,.pill-crit{background:rgba(220,38,38,.1);color:#b91c1c;border-color:rgba(220,38,38,.28)}
.pill-warn{background:rgba(217,119,6,.12);color:#a16207;border-color:rgba(217,119,6,.3)}
.pill-proc{background:rgba(124,58,237,.1);color:#6d28d9;border-color:rgba(124,58,237,.28)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.nav-item:hover{background:rgba(13,150,105,.08);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(13,150,105,.3)}
.nav-item.active svg{color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#0a7a55}
.btn-ghost{background:var(--card);border-color:var(--border);color:var(--text)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(220,38,38,.08);color:#b91c1c;border-color:rgba(220,38,38,.25)}.btn-danger:hover{background:rgba(220,38,38,.15)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;background:#fff;color:var(--text);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tbl-row:hover{background:rgba(13,150,105,.04)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,18,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal-box{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);width:100%;max-width:720px;margin:auto 0}
.plant-block{border:1px dashed var(--border);border-radius:12px;padding:14px;background:#fafcfb}
.chip-link{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:#0a7a55;font-weight:600;text-decoration:none;margin:2px 4px 2px 0}
.chip-link:hover{background:rgba(13,150,105,.2)}
.err{display:none;margin-bottom:14px;padding:10px 13px;border-radius:9px;background:rgba(220,38,38,.09);border:1px solid rgba(220,38,38,.3);color:#b91c1c;font-size:12.5px;font-weight:600}
.th{background:#f6faf7;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.th th{text-align:left;padding:12px 20px;font-weight:700}

.sidebar{width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;transition:width .2s cubic-bezier(0.4, 0, 0.2, 1), padding .2s cubic-bezier(0.4, 0, 0.2, 1)}
.sidebar.collapsed{width:72px;padding:22px 10px}
.sidebar.collapsed .sidebar-hide{display:none !important}
.sidebar.collapsed .sidebar-header-box{justify-content:center !important;padding:0 0 14px !important}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px 0}
.sidebar.collapsed .nav-item svg{margin:0;width:19px;height:19px}
.sidebar-toggle-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.04);flex-shrink:0}
.sidebar-toggle-btn:hover{background:rgba(13,150,105,.1);color:var(--accent);border-color:var(--accent)}
.sidebar-toggle-btn svg{transition:transform .25s ease;display:block}
.sidebar.collapsed .sidebar-toggle-btn svg{transform:rotate(180deg)}
.sidebar-toggle-btn:hover{background:rgba(13,150,105,.1);color:var(--accent);border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(13,150,105,.25);border-radius:4px}

@media print {
 @page { size: A4; margin: 12mm; }
 body { background: #fff !important; }
 #appSidebar, #main, #headerExtra, .no-print { display: none !important; }
 .modal-overlay { position: static !important; display: block !important; padding: 0 !important; background: none !important; overflow: visible !important; }
 .relatorio-modal-container { max-width: none !important; width: 100% !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
 .relatorio-folha { padding: 0 !important; font-size: 11pt !important; background:#f3f3f3 !important; }
 .relatorio-folha h2:last-of-type { page-break-before: always; }
}


@media print {
  body * { visibility: hidden !important; }
  #relatorio-folha-content, #relatorio-folha-content * { visibility: visible !important; }
  #relatorio-folha-content {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
  }
  @page {
    size: A4 portrait;
    margin: 12mm 15mm;
  }
  .page-break-before {
    page-break-before: always !important;
    break-before: page !important;
  }
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}


/* EnvitecEnergy v1.8: diálogos consistentes e retorno discreto */
.ev-dialog-panel{max-width:470px}
.ev-dialog-message{padding:20px 24px;font-size:13.5px;line-height:1.6}
.ev-count{font-size:11px;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);margin-left:4px}
.ev-danger-confirm{background:#c73535;color:#fff}
.ev-danger-confirm:hover{background:#a62828;color:#fff}
.ev-danger-confirm:disabled{opacity:.62;cursor:not-allowed}
#envitec-toast{position:fixed;right:24px;bottom:22px;z-index:10005;background:#fff;color:#0f1f17;border:1px solid #a7e0c3;border-left:4px solid #0d9669;box-shadow:0 10px 32px rgba(0,0,0,.14);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700;max-width:360px}
/* v1.9: adapt controls and dialogs without changing the identity. */
#main{min-width:0;flex:1;max-width:100%;padding:30px 36px}
#main table{max-width:100%}
.modal-box{max-width:min(720px,100%)}
.ev-plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,210px));gap:12px}
.ev-plan-card{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-around;text-align:center;border:1px solid var(--border);border-radius:12px;padding:10px}
.ev-exp-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev-exp-filters .btn.active{background:var(--accent)!important;color:#fff!important}
.ev-power-label{color:#334155!important}
.ev-hover-info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid #cbd5e1;border-radius:50%;font-size:12px;color:#64748b;cursor:help}
.ev-attachment-preview{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.ev-icon-clip{font-size:18px;padding:5px 12px;line-height:1}
.ev-old-note{padding:10px;border-radius:8px;background:#f5f8f6;border:1px solid var(--border);font-size:12px;white-space:pre-wrap}
.ev-dialog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:920px){
 #main{padding:18px 16px!important}
 .sidebar{width:200px}
 #main>div:first-child{gap:8px}
 .modal-overlay{padding:10px}
 .modal-box{margin:auto 0}
 .ev-plan-grid{grid-template-columns:repeat(auto-fit,minmax(140px,180px))}
}
@media(max-width:640px){
 #app{flex-direction:column!important;align-items:stretch!important}
 .sidebar{position:relative;height:auto;width:100%!important;padding:10px!important;max-height:none!important;flex-direction:row;flex-wrap:wrap;align-items:center}
 .sidebar-header-box{width:100%;margin-bottom:4px!important;padding-bottom:5px!important}
 .sidebar .nav-item{font-size:12px;padding:8px}
 .sidebar .sidebar-hide{display:flex!important}
 .sidebar.collapsed .nav-item{padding:8px}
 #main{width:100%!important;padding:14px 10px!important}
 #main h1{font-size:22px!important}
 .modal-overlay{padding:6px;align-items:center}
 .modal-box{border-radius:12px;max-height:98vh;overflow:auto}
 .ev-dialog-grid{grid-template-columns:1fr}
 .ev-plan-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
 .btn{white-space:normal;text-align:center;justify-content:center}
}

/* EnvitecEnergy v1.10 — tabelas, cards, formulários e acessibilidade */
.ev-plan-link{background:#fff;color:var(--text);cursor:pointer;font:inherit;transition:border-color .15s,box-shadow .15s}
.ev-plan-link:hover,.ev-plan-link:focus-visible{border-color:var(--accent);box-shadow:0 5px 18px rgba(13,150,105,.13);outline:2px solid transparent}
.ev-client-list{display:grid;gap:6px}
.ev-client-list-item{padding:12px;border-bottom:1px solid var(--border);font-weight:650;font-size:13px}
.ev-contract-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin:20px 0}
.ev-contract-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ev-contract-bar h3{font-size:15px}
.ev-contract-bar select,.ev-contract-bar input{border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;background:#fff}
.ev-contract-line{display:flex;gap:18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding:10px 0;font-size:13px}
.ev-no-results{color:var(--muted);font-size:13px;padding:18px 0}
.ev-plant-link{color:#087758;text-decoration:underline;text-underline-offset:3px;font-weight:750}
.ev-plant-link:hover{color:#075d45}
.ev-plant-link:focus-visible,.ev-icon-action:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ev-quick-actions{display:flex;gap:5px;align-items:center;white-space:nowrap}
.ev-icon-action{padding:5px;width:32px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.ev-icon-warn{color:#b45309!important}
.ev-icon-normal{color:#078c61!important}
.ev-status-inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev-duration{font-size:10px;font-weight:700;color:#b45309;white-space:nowrap}
.ev-admin-stats{font-size:11.5px;color:var(--muted);padding:0 4px 12px}
.ev-confirm-details{display:grid;gap:8px;font-size:13px;line-height:1.45}
.ev-last-fault{border:1px solid #facc80;background:#fff9ec;border-radius:10px;padding:12px;margin-top:15px;display:grid;gap:6px;font-size:12px;white-space:pre-wrap}
.ev-analysis-date{font-size:12px;color:var(--muted);margin-bottom:14px}
.manage-local-header{gap:10px!important}
.manage-local-header>div:last-child{display:flex;flex-wrap:wrap;align-items:center;gap:6px!important}
@media(max-width:700px){.ev-quick-actions{gap:3px}.ev-icon-action{width:29px;height:30px}.ev-contract-panel{padding:12px}.ev-plan-card{min-height:155px}}

.ev-retro-pending{background:#fff9ed;border:1px solid #fcdba5;border-radius:9px;padding:10px;font-size:12px;margin-bottom:10px}
.ev-pending-days{display:flex;gap:6px;flex-wrap:wrap;max-height:100px;overflow-y:auto}
.ev-toggle-active{border-color:#059669!important;color:#059669!important;background:#ecfdf5!important;}
.ev-retro-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.ev-calendar-date{font-size:11px;padding:7px 2px;background:#f8faf9;border:1px solid #edf1ef;border-radius:7px;color:#9aa6a0}
.ev-calendar-date.ev-calendar-missing{background:#fff4da;color:#925e00;border-color:#f9c970;cursor:pointer;font-weight:800}
.ev-calendar-date.ev-calendar-missing:hover{background:#ffe5af}

/* Relatório mensal: referência visual oficial fornecida pelo usuário (2 páginas A4). */
.relatorio-modal-container{width:100%;max-width:850px;margin:auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 16px 45px rgba(0,0,0,.2)}
.ev-report-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;background:#f8faf9;border-bottom:1px solid #dbe5de;padding:10px}
.ev-report-toolbar>strong{margin-right:auto;font-size:13px}
.ev-report-document{background:#fff;font:12px Arial,Helvetica,sans-serif;color:#050505;line-height:1.18}
.ev-report-page{box-sizing:border-box;position:relative;display:block;width:210mm;height:297mm;max-width:none;padding:18mm 18mm 16mm;margin:0 auto;background:#fff;overflow:hidden}
.ev-report-page-two{break-before:page;page-break-before:always;padding-top:20mm}
.ev-report-header{display:flex;align-items:center;justify-content:space-between;gap:12mm;margin:0 0 9mm}
.ev-report-logo{display:block;object-fit:contain;max-width:40mm;max-height:24mm}
.ev-report-header-title{display:flex;flex-direction:column;align-items:flex-end;text-align:right;color:#1357d3;font-size:15px;line-height:1.17}
.ev-report-header-title span{font-weight:400;font-size:14px}
.ev-report-contact{font-size:8.2px;color:#9b9b9b;line-height:1.8;margin-bottom:5mm}
.ev-report-main-title{color:#0d55cd;font-size:15px;font-weight:750;border-bottom:2px solid #07568b;padding-bottom:4mm;margin:0 0 5mm;white-space:nowrap}
.ev-report-bar{background:#00548a;color:white;font-size:14.5px;margin:4mm 0 0;padding:1px 3px;line-height:1.12;font-weight:800}
.ev-report-client{background:#e3e3e3;border:1px solid #bdbdbd;font-size:11.5px;padding:3px 5px;margin-bottom:6mm}
.ev-report-body{background:#f2f2f2;border:1px solid #bbb;border-top:0;padding:10px 3px 8px;font-size:11.6px;line-height:1.12;text-align:left}
.ev-report-body p{margin:0 0 11px}
.ev-report-body p:last-child{margin:0}
.ev-report-page-rule{border-top:1px solid #222;margin-top:10mm}
.ev-report-conclusion{padding:4px 3px 6px}
.ev-report-conclusion p{margin:0 0 11px}
@media screen and (max-width:850px){.relatorio-modal-container{overflow-x:auto}.ev-report-document{width:210mm}}
@media print{.ev-report-page{margin:0!important;box-shadow:none!important;page-break-after:always}.ev-report-page-two{page-break-before:always}}
</style>
<style id="envitec-web-auth-style">
/* Isolated authentication screen; styles inside #envitec-auth only. */
body.envitec-locked #app { display:none !important; }
#envitec-auth { position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f4f8f5;padding:16px;font-family:"Figtree",Arial,sans-serif;color:#0f1f17; }
#envitec-auth[hidden]{display:none!important}
#envitec-auth .ev-card{width:100%;max-width:415px;background:white;border:1px solid rgba(15,31,23,.12);border-radius:16px;box-shadow:0 16px 55px rgba(14,60,38,.10);padding:30px}
#envitec-auth h1{font-size:24px;line-height:1.2;font-weight:800;margin:0 0 6px}
#envitec-auth p{font-size:13px;line-height:1.5;color:#5b6b62;margin:0 0 21px}
#envitec-auth label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px;color:#5b6b62}
#envitec-auth input{width:100%;padding:11px 12px;border:1px solid rgba(15,31,23,.2);border-radius:9px;background:#fff;color:#0f1f17;font:inherit;font-size:14px}
#envitec-auth input:focus{outline:2px solid rgba(13,150,105,.25);border-color:#0d9669}
#envitec-auth button{margin-top:20px;width:100%;border:none;border-radius:9px;padding:12px;background:#0d9669;color:white;font-weight:800;cursor:pointer;font-size:14px}
#envitec-auth button:disabled{opacity:.6;cursor:wait}
#envitec-auth .ev-error{color:#b91c1c;background:#fef2f2;padding:10px 12px;font-size:12.5px;border-radius:8px;margin-top:15px;white-space:pre-wrap}
#envitec-auth .ev-status{font-size:13px;color:#5b6b62;margin-top:12px}
</style>
</head>
<body class="envitec-locked">
<div style="position:relative;background:var(--bg);min-height:100vh;">
  <div id="app" style="display:flex;gap:0;align-items:flex-start;">
    <aside id="appSidebar" class="sidebar">

<script>
(async function(){
var KEY='envitec_energy_v8',OLD='envitec_energy_v3';
var BRANDS=['ABB','APsystems','Deye','Each Energy','Fronius','GoodWe','Growatt','Hoymiles','Huawei','Livoltek','Omnik','SAJ','SMA','Sofar','Solax','SolarEdge','Solis','Solplanet','Sungrow','WEG','Outra'];
var PLANS=['Essencial','Instalação / Venda de Kit','Especial','Premium','Platinum'];
var UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
var TIPOS=['Inversor','Microinversor'],REGS=['Nova Usina','Expansão'];
var ROLE_LABELS={admin:'Administrador',monitor:'Monitoramento',analista:'Análise Técnica'};
function roleChoices(current){return ['admin','monitor','analista'].map(function(r){return '<option value=\"'+r+'\"'+(r===current?' selected':'')+'>'+ROLE_LABELS[r]+'</option>';}).join('');}
function contractNumberOnly(c){return String(c.contractNo||'').split('/')[0].trim();}
function powerLabel(v){if(v===null||v===undefined||v==='')return '';var n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3})+' kWp':'';}
var BRANDS_BY_TYPE={
  'Inversor':['ABB','Deye','Each Energy','Fronius','GoodWe','Growatt','Huawei','Livoltek','Omnik','SAJ','SMA','Sofar','Solax','SolarEdge','Solis','Solplanet','Sungrow','WEG','Outra'],
  'Microinversor':['APsystems','Deye','Hoymiles','Outra']
};
function brandsFor(t){return BRANDS_BY_TYPE[t]||BRANDS}
var STATUS=['GERAÇÃO NORMAL','FALHA COMUNICAÇÃO','FALHA COMUNICAÇÃO - PARCIALMENTE','FALHA COMUNICAÇÃO - ANÁLISE FABRICANTE','FALHA TÉCNICA','FALHA TÉCNICA - ANÁLISE FABRICANTE','FALHA TÉCNICA - ERRO DE ISOLAMENTO','FALHA GERAÇÃO','ACIONAMENTO DE GARANTIA','AGENDAMENTO','SERVIÇO EQUIPE DE CAMPO','AGUARDANDO CLIENTE','CLIENTE SEM MONITORAMENTO','INSTABILIDADE NA PLATAFORMA','TRATATIVA COMERCIAL - EM NEGOCIAÇÃO','EM OBSERVAÇÃO - ANÁLISE FABRICANTE','EM OBSERVAÇÃO - MONITORAMENTO','SISTEMA DESLIGADO','SEM MONITORAMENTO'];
var SERVICOS=['ANÁLISE E/OU CORREÇÃO DE COMPONENTES','RECONFIGURAÇÃO DA COMUNICAÇÃO','ACIONAMENTO DE GARANTIA','VISITA TÉCNICA','LIMPEZA DOS MÓDULOS'];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){
  // Data operacional da EnvitecEnergy, independente do fuso horário do computador.
  var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var o={};parts.forEach(function(p){o[p.type]=p.value});
  return o.year+'-'+o.month+'-'+o.day;
}
function fmtBR(d){
  if(!d)return '—';
  var parts = d.split(' ');
  var datePart = parts[0].split('-');
  var formattedDate = (datePart[2]||'') + '/' + (datePart[1]||'') + '/' + (datePart[0]||'');
  if(parts.length > 1 && parts[1]){
    return formattedDate + ' ' + parts[1].slice(0,5);
  }
  return formattedDate;
}
function createdDay(iso){
  if(!iso)return '';
  var d=new Date(iso);
  if(Number.isNaN(d.getTime()))return '';
  var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  var p={};parts.forEach(function(x){p[x.type]=x.value});
  return p.year+'-'+p.month+'-'+p.day;
}
function fmtTimestamp(iso){
  if(!iso)return '—';
  var dt=new Date(iso);
  return Number.isNaN(dt.getTime())?'—':dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Fortaleza'});
}
function nowTimestamp(){
  var dt = new Date();
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
}
function isCovered(c){return c.expiry>=today()}
function isClientActive(c){return !!c && c._active!==false}
function isPlantActive(p){return !!p && p._active!==false}
function monitoredClients(){return state.clients.filter(function(c){return isClientActive(c)&&isCovered(c)&&(c.plants||[]).some(isPlantActive);});}
function clientPlanGroup(plan){return plan==='Instalação / Venda de Kit'||plan==='Essencial (Instalação / Venda de Kit)'?'Essencial':plan;}
function activeClientPlants(c){return (c.plants||[]).filter(isPlantActive);}
function alphaName(a,b){return String(a||'').localeCompare(String(b||''),'pt-BR',{numeric:true,sensitivity:'base'})}
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function rd(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){
  // v1.5: only browser preferences; NEVER write operational data to localStorage.
  try { localStorage.setItem('envitec_web_preferences_v1', JSON.stringify({ view:state.view, search:state.search, showExpired:state.showExpired })); }
  catch(err){console.warn('Preferências locais indisponíveis.',err)}
}
function isFault(s){return /^(FALHA|ACIONAMENTO)/.test(s||'')}
function sClass(s){if(!s||s.indexOf('NORMAL')>-1)return 'ok';if(s.indexOf('COMUNICA')>-1)return 'warn';if(/TÉCNICA|GERAÇÃO|ACIONAMENTO/.test(s))return 'crit';return 'proc'}
function pillFault(s){
  var str = (s || STATUS[0]).trim();
  var parts = str.split(/\s*-\s*/);
  var main = parts[0];
  var sub = parts.slice(1).join(' - ');
  var isMulti = !!sub;
  var html = '<span class="pill pill-'+sClass(str)+'" style="text-align:left;line-height:1.2;white-space:nowrap;' + (isMulti ? 'border-radius:12px;padding:4px 10px;' : '') + '">'
    + '<span class="dot" style="flex-shrink:0;"></span>'
    + '<span style="display:inline-flex;flex-direction:column;align-items:flex-start;">'
    + '<span>' + esc(main) + '</span>';
  if(sub){
    html += '<span style="font-size:9.5px;font-weight:600;opacity:.88;text-transform:none;letter-spacing:0;margin-top:1px;">(' + esc(sub) + ')</span>';
  }
  html += '</span></span>';
  return html;
}

function getFaultDuration(p){
  var activeChannels=(p._faultChannels||[]).filter(function(ch){return !ch.resolved_at;});
  if(activeChannels.length){
    var oldest=activeChannels.slice().sort(function(a,b){return String(a.opened_at).localeCompare(String(b.opened_at));})[0];
    var ms=Math.max(0,Date.now()-new Date(oldest.opened_at).getTime());
    var days=Math.floor(ms/86400000), hours=Math.floor(ms/3600000);
    return {text:days>=2?'Ativo há '+days+' dias':days===1?'Ativo há 1 dia ('+hours+'h)':'Ativo há '+Math.max(1,hours)+'h',since:oldest.opened_at,records:activeChannels.length};
  }
  if(!isFault(p.status)) return null;
  var ds=Object.keys(p.hist||{}).sort().reverse();
  if(!ds.length) return {text:'Ocorrência recente',since:'',records:0};
  var firstDate=null;
  var records=0;
  for(var i=0;i<ds.length;i++){
    if(isFault(p.hist[ds[i]].status)){
      firstDate=ds[i];
      records++;
    } else {
      break;
    }
  }
  if(!firstDate) firstDate=ds[0];
  var dClean = firstDate.replace(' ', 'T');
  var past = new Date(dClean);
  var now = new Date();
  var diffMs = now - past;
  if(isNaN(diffMs) || diffMs < 0) diffMs = 0;
  var diffMins = Math.floor(diffMs / (1000 * 60));
  var diffHours = Math.floor(diffMs / (1000 * 60 * 60));
  var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  var text = '';
  if(diffDays >= 2){
    text = 'Ativo há ' + diffDays + ' dias';
  } else if(diffDays === 1){
    text = 'Ativo há 1 dia (' + diffHours + 'h)';
  } else if(diffHours >= 1){
    text = 'Ativo há ' + diffHours + 'h';
  } else {
    text = 'Ativo há ' + Math.max(1, diffMins) + ' min';
  }
  return {
    text: text,
    since: firstDate,
    records: records
  };
}

function shiftDateStr(dateStr, deltaDays){
  try {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    d.setDate(d.getDate() + deltaDays);
    var y = d.getFullYear();
    var m = (d.getMonth()+1 < 10 ? '0' : '') + (d.getMonth()+1);
    var day = (d.getDate() < 10 ? '0' : '') + d.getDate();
    return y + '-' + m + '-' + day;
  } catch(e) { return dateStr; }
}
function formatDateFullBR(dateStr){
  try {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    var wd = ['domingo','segunda-feira','ter\u00e7a-feira','quarta-feira','quinta-feira','sexta-feira','s\u00e1bado'];
    var mo = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    return wd[d.getDay()] + ', ' + d.getDate() + ' de ' + mo[d.getMonth()] + ' de ' + d.getFullYear();
  } catch(e) { return dateStr; }
}
function getDailyEntry(p, dateStr){
  if(!p || !p.hist) return null;
  var keys = Object.keys(p.hist).sort().reverse();
  for(var i=0;i<keys.length;i++){
    if(keys[i].indexOf(dateStr) === 0 && !p.hist[keys[i]]._update && !p.hist[keys[i]]._analysisOnly) return { key: keys[i], entry: p.hist[keys[i]] };
  }
  return null;
}
function getPreviousEntry(p, dateStr){
  if(!p || !p.hist) return null;
  var keys = Object.keys(p.hist).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var kDate = keys[i].split(' ')[0];
    if(kDate < dateStr) return { key: keys[i], entry: p.hist[keys[i]] };
  }
  return null;
}

function reportMonthName(m){return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1]||('Mês '+m);}
function requiredMonitoringDay(p,day){
  // v1.9: calendário diário, somente durante o período ativo da tecnologia;
  // exceções contratuais podem ser configuradas em envitec_monitoring_schedule.
  if(p._schedule && p._schedule.valid_from && day<p._schedule.valid_from)return false;
  if(p._schedule && p._schedule.valid_until && day>p._schedule.valid_until)return false;
  if(p._schedule && Array.isArray(p._schedule.weekdays)){
    var n=new Date(day+'T12:00:00').getDay();
    if(p._schedule.weekdays.indexOf(n)<0)return false;
  }
  if(p._schedule && Array.isArray(p._schedule.excluded_dates) && p._schedule.excluded_dates.indexOf(day)>=0)return false;
  return true;
}
function localReportStatus(client,loc,ym){
  var plants=(client.plants||[]).filter(function(p){return isPlantActive(p)&&((p.local||'').trim()||'Local não informado')===loc;});
  if(!plants.length)return null;
  var a=ym.split('-'),y=Number(a[0]),m=Number(a[1]);
  var totalDays=new Date(y,m,0).getDate(),missing=[],checked=0,required=0;
  for(var day=1;day<=totalDays;day++){
    var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var obligations=plants.filter(function(p){return requiredMonitoringDay(p,ds);});
    if(!obligations.length)continue;
    required++;
    var allDone=true;
    obligations.forEach(function(p){if(!getDailyEntry(p,ds)){allDone=false;missing.push({day:ds,plant_id:p.id,plant_name:p.plantName});}});
    if(allDone)checked++;
  }
  var isClosed=ym<today().slice(0,7);
  return {ym:ym,year:y,month:m,name:reportMonthName(m),total:required,checked:checked,
    complete:isClosed&&required>0&&missing.length===0,closed:isClosed,missing:missing};
}
function allLocalReportStatuses(client, loc){
  var seen = {};
  (client.plants||[]).forEach(function(p){
    if(((p.local||"").trim() || "Local não informado") !== loc) return;
    Object.keys(p.hist||{}).forEach(function(k){
      var d = k.split(" ")[0];
      if(/^\d{4}-\d{2}-\d{2}$/.test(d)) seen[d.slice(0, 7)] = 1;
    });
  });
  seen[today().slice(0,7)]=1;
  var previousMonth=new Date(today().slice(0,7)+'-01T12:00:00');previousMonth.setMonth(previousMonth.getMonth()-1);
  seen[ymd(previousMonth).slice(0,7)]=1;
  return Object.keys(seen).sort().reverse().map(function(ym){ return localReportStatus(client, loc, ym); }).filter(Boolean);
}
function availableLocalReports(client, loc){
  return allLocalReportStatuses(client, loc).filter(function(r){ return r && r.complete && r.closed; });
}
function computeMonthlyReportConclusion(client, loc, ym){
  var plants = (client.plants||[]).filter(function(p){ return ((p.local||"").trim() || "Local não informado") === loc; });
  if(!plants.length) return null;
  var a = ym.split("-"), y = +a[0], m = +a[1], totalDays = new Date(y, m, 0).getDate();
  var numLines = plants.length, faultCounts = [], communicatingCounts = [];
  var hasLineCommunicating = false, hasAbsoluteCommFault = false;
  for(var r=0; r<numLines; r++){
    var p=plants[r], fCount=0, cCount=0, lineHasComm=false, lineHasPureCommFault=false;
    for(var day=1; day<=totalDays; day++){
      var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      var entry=getDailyEntry(p,ds), st=entry?String(entry.status||'').trim().toUpperCase():'';
      var partial=st.indexOf('PARCIALMENTE')!==-1;
      var technical=st.indexOf('FALHA TÉCNICA')!==-1 || st.indexOf('FALHA TECNICA')!==-1;
      var totalFault=!technical && ((st.indexOf('FALHA')!==-1 && !partial) || st.indexOf('SEM MONITORAMENTO')!==-1 || st.indexOf('INSTABILIDADE NA PLATAFORMA')!==-1 || st.indexOf('SISTEMA DESLIGADO')!==-1);
      if(!st || st==='NULL' || st==='UNDEFINED' || st==='-'){
        // Complete reports have entries for every day, but preserve blank semantics from the spreadsheet automation.
      } else if(technical){
        cCount++; lineHasComm=true;
      } else if(partial){
        fCount++; cCount++; lineHasComm=true;
      } else if(totalFault){
        fCount++;
        if(st.indexOf('FALHA COMUNICAÇÃO')!==-1 || st.indexOf('FALHA COMUNICACAO')!==-1) lineHasPureCommFault=true;
        else lineHasComm=true;
      } else {
        cCount++; lineHasComm=true;
      }
    }
    faultCounts.push(fCount); communicatingCounts.push(cCount);
    if(lineHasComm) hasLineCommunicating=true;
    if(lineHasPureCommFault && cCount===0) hasAbsoluteCommFault=true;
  }
  var maxFaults=Math.max.apply(null,faultCounts), minFaults=Math.min.apply(null,faultCounts), maxCommunicating=Math.max.apply(null,communicatingCounts);
  var status, bullets, color, bg, border;
  if(maxFaults<=4 && !hasAbsoluteCommFault){
    status='Comunicação Estável'; color='#1157ce'; bg='#eff6ff'; border='#bfdbfe';
    bullets=[
      'Durante o período analisado, a comunicação da usina apresentou-se estável e dentro dos parâmetros esperados, permitindo o acompanhamento adequado dos equipamentos e variáveis operacionais por meio do sistema de monitoramento.',
      'Não foram identificadas interrupções relevantes que comprometessem a disponibilidade dos dados ou o acompanhamento da operação da usina.'
    ];
  } else if(maxCommunicating>=5 || (numLines>1 && minFaults<=4) || (numLines>1 && hasLineCommunicating && hasAbsoluteCommFault)){
    status='Comunicação Instável'; color='#1157ce'; bg='#eff6ff'; border='#bfdbfe';
    bullets=[
      'Durante o período analisado, foram identificadas instabilidades na comunicação da usina, caracterizadas por interrupções e/ou oscilações na transmissão dos dados dos equipamentos para o sistema de monitoramento.',
      'Essas ocorrências podem comprometer temporariamente a visualização das informações operacionais e dificultar o acompanhamento em tempo real.'
    ];
  } else {
    status='Comunicação Ausente'; color='#1157ce'; bg='#eff6ff'; border='#bfdbfe';
    bullets=[
      'Durante o período analisado, foi constatada ausência de comunicação com a usina, impossibilitando o acompanhamento remoto dos dados operacionais pelo sistema de monitoramento.',
      'Essa condição limita a capacidade de identificação de falhas e avaliação do desempenho da usina em tempo real.'
    ];
  }
  return {status:status, bullets:bullets, color:color, bg:bg, border:border};
}

function rAnalise(){
  state.ocorrenciasFilter = state.ocorrenciasFilter || 'ALL';
  state.showExpiredOcorrencias = !!state.showExpiredOcorrencias;

  var allOccurrences = [];
  state.clients.filter(isClientActive).forEach(function(c){
    (c.plants||[]).filter(isPlantActive).forEach(function(p){
      if(p._activeOccurrence && isFault(p.status)){
        var ds = Object.keys(p.hist||{}).sort().reverse();
        var faultCount = 0;
        var firstFaultDate = null;
        for(var i=0; i<ds.length; i++){
          if(isFault(p.hist[ds[i]].status)){
            faultCount++;
            firstFaultDate = ds[i];
          } else {
            break;
          }
        }
        var latestEntry = ds.length ? p.hist[ds[0]] : null;
        allOccurrences.push({
          c: c,
          p: p,
          days: faultCount || 1,
          since: firstFaultDate || (latestEntry ? ds[0] : today()),
          latest: latestEntry,
          allDates: ds
        });
      }
    });
  });

  var coveredOccurrences = allOccurrences.filter(function(o){ return isCovered(o.c); });
  var expiredOccurrences = allOccurrences.filter(function(o){ return !isCovered(o.c); });
  var expiredCount = expiredOccurrences.length;

  var workingList = coveredOccurrences;

  var totalFalhas = workingList.length;
  var comFalhas = workingList.filter(function(o){ return (o.p.status||'').indexOf('COMUNICAÇÃO') > -1; }).length;
  var tecFalhas = workingList.filter(function(o){ return (o.p.status||'').indexOf('TÉCNICA') > -1; }).length;
  var gerFalhas = workingList.filter(function(o){ return (o.p.status||'').indexOf('GERAÇÃO') > -1; }).length;

  var currentFilter = state.ocorrenciasFilter;
  var displayedList = workingList.filter(function(o){
    if(currentFilter === 'COMUNICAÇÃO') return (o.p.status||'').indexOf('COMUNICAÇÃO') > -1;
    if(currentFilter === 'TÉCNICA') return (o.p.status||'').indexOf('TÉCNICA') > -1;

    return true;
  });

  var topControlsHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">'

function parseContractNum(cn){
  if(!cn || cn==='-') return 99999999;
  var m = String(cn).match(/\d+/);
  return m ? parseInt(m[0], 10) : 99999999;
}
function fillCad(){
  var q=(state.search||'').toLowerCase().trim();
  var fp=state.filterPlan||'';
  var fm=state.filterMonth||'';
  var fv=state.filterVig||'';
  var l=state.clients.filter(function(c){
    var matchQ = !q || c.name.toLowerCase().indexOf(q)>-1 || c.contractNo.toLowerCase().indexOf(q)>-1 || (c.uf||'').toLowerCase()===q;
    var matchPlan = !fp || c.plan === fp;
    var expMonth = (c.expiry||'').split('-')[1] || '';
    var matchMonth = !fm || expMonth === fm;
    var cob = isCovered(c);
    var matchVig = !fv || (fv==='coberto' ? cob : !cob);
    return matchQ && matchPlan && matchMonth && matchVig;
  });
  var sortCol = state.sortCol || 'contract';
  var sortDir = state.sortDir || 'asc';
  var mult = sortDir === 'desc' ? -1 : 1;

  l.sort(function(a,b){
    if(sortCol === 'name'){
      return mult * (a.name || '').localeCompare(b.name || '', 'pt-BR', { sensitivity: 'base' });
    } else {
      var diff = parseContractNum(a.contractNo) - parseContractNum(b.contractNo);
      if(diff !== 0) return mult * diff;
      return mult * (a.contractNo || '').localeCompare(b.contractNo || '');
    }
  });

  var icContract = $('sortIconContract');
  var icName = $('sortIconName');
  if(icContract && icName){
    if(sortCol === 'contract'){
      icContract.textContent = sortDir === 'asc' ? ' ↑' : ' ↓';
      icContract.style.color = 'var(--primary)';
      icName.textContent = ' ↕';
      icName.style.color = 'var(--muted)';
    } else {
      icName.textContent = sortDir === 'asc' ? ' ↑ (A-Z)' : ' ↓ (Z-A)';
      icName.style.color = 'var(--primary)';
      icContract.textContent = ' ↕';
      icContract.style.color = 'var(--muted)';
    }
  }
  $('countLabel').textContent=l.length+' de '+state.clients.length+' cliente(s)';
  var isAdmin=window.EnvitecWeb.profile.role==='admin';
  $('cadTbody').innerHTML=l.length?l.map(function(c){return '<tr class="tbl-row" style="border-bottom:1px solid var(--border);"><td style="padding:14px 20px;font-weight:800;color:var(--accent);">'+esc(contractNumberOnly(c))+'</td><td style="padding:14px 20px;font-weight:700;">'+esc(c.name)+'</td><td style="padding:12px 20px;">'+(isClientActive(c)?plantChips(c):'<span style="font-weight:700;color:#b45309;">Desativado</span> · '+plantChips(c))+'</td><td style="padding:12px 20px;">'+esc(fmtBR(c.expiry))+'<div style="margin-top:4px">'+pillVig(c)+'</div></td><td style="padding:12px 20px;">'+pillPlan(c.plan)+'</td><td style="padding:14px 20px;"><div style="display:flex;gap:7px;"><button class="btn btn-primary btn-sm" data-action="gerenciar" data-id="'+c.id+'">Gerenciar Unidades</button>'+(isAdmin?'<button class="btn btn-ghost btn-sm" data-action="editar-cliente" data-id="'+c.id+'">Editar dados do cliente</button><button class="btn btn-ghost btn-sm" data-action="client-history" data-id="'+c.id+'">Histórico do Cliente</button>':'')+'</div></td></tr>'}).join(''):'<tr><td colspan="6" style="padding:28px;text-align:center;color:var(--muted);">Nenhum cliente encontrado. Clique em "Novo Cliente" para cadastrar.</td></tr>';
}

function histModal(cid,pid){
  var c=find(cid),p=plant(c,pid),ds=Object.keys(p.hist||{}).sort().reverse(),groups={};

  var analysisByDate={};
  analysesAll.forEach(function(a){var day=a.analysis_date||createdDay(a.created_at);if(!day)return;(analysisByDate[day]=analysisByDate[day]||[]).push(a);});
  var seenDays=new Set(ds.map(function(k){return k.slice(0,10);}));
  Object.keys(analysisByDate).forEach(function(day){if(!seenDays.has(day))ds.push(day+' 23:59:59.999');});
  ds.sort().reverse();
  ds.forEach(function(d){var ym=d.slice(0,7);if(!groups[ym])groups[ym]=[];groups[ym].push(d);});
  var yms=Object.keys(groups).sort().reverse();
  var b=mHead('Histórico da Usina',esc(c.name)+' · 📍 '+esc((p.local||'Local não informado'))+' · '+esc(p.tipo||'Equipamento')+' · '+esc(p.brand||'Fabricante não informado'))+'<div style="padding:16px 20px;max-height:65vh;overflow-y:auto;">';
  var adminNotes=(p._adminNotes||[]).slice().sort(function(x,y){return String(y.created_at).localeCompare(String(x.created_at));});
  if(adminNotes.length)b+='<div style="border-left:3px solid var(--accent);padding:8px 12px;margin-bottom:12px;">'+adminNotes.map(function(n){return '<div style="margin-bottom:8px;font-size:12px;"><b>Complemento Administrativo · '+esc(fmtTimestamp(n.created_at))+'</b><div style="white-space:pre-wrap;">'+esc(n.body)+'</div></div>';}).join('')+'</div>';
  if(!ds.length){

     if(!clientObj || !block)return showError('Cadastro não encontrado. Atualize o sistema.');
     var values=readBlock(block);
     if(!d.pid){var mode=d.fixedlocal?'fixed':$('ev_target_type').value;values.local=(mode==='fixed'?d.fixedlocal:mode==='new'?$('ev_new_local').value:$('ev_existing_local').value).trim();
       values.registro=(mode==='fixed'||mode==='existing')?'Expansão':'Nova Usina';
       if(!values.local)return showError('Informe o local da tecnologia.');}
     if(!values.plantName.trim())return showError('Informe o nome da planta na plataforma.');
     var previous=d.pid ? plant(clientObj,d.pid):null;
     if(d.pid && !previous)return showError('Tecnologia não encontrada. Atualize o sistema.');
     if(previous)values.registro=previous.registro||'Nova Usina';
     return await saveToSupabase(function(){
       return previous ? window.EnvitecWeb.updateOperationalPlant(previous.id,previous._updatedAt,values)
                       : window.EnvitecWeb.createPlant(clientObj.id,values);
     },t,function(){render();gerenciar(d.cid);});
   }
if(a==='download-report-pdf')return downloadPdfFile(d.filename);
  if(a==='edit-daily-reg')return showError('Retificação de registro ainda não habilitada.');
  if(a==='locked-analise'){
    return notify('Contrato vencido. Renove a vigência para registrar análises técnicas.',true);
  }
  if(a==='filter-ocorrencias'){
    state.ocorrenciasFilter = (state.ocorrenciasFilter === d.tipo ? 'ALL' : d.tipo);
    return render();
  }
  if(a==='toggle-expired-ocorrencias'){
    state.showExpiredOcorrencias = !state.showExpiredOcorrencias;
    return render();
  }
  if(a==='reg'||a==='reg-falha')return regModal(d.cid,d.pid,null);
  if(a==='hist'||a==='ver-historico'){
    if(a==='hist' && $('an_text'))window.evAnalysisReturn={cid:d.cid,pid:d.pid,text:$('an_text').value};
    else window.evAnalysisReturn=null;
    return histModal(d.cid,d.pid);
  }
  if(a==='return-to-analysis'){var draft=window.evAnalysisReturn;if(draft)return analiseModal(draft.cid,draft.pid);return closeModal();}
  if(a==='register-past-check')return retroModal(d.cid,d.pid,{type:'history',cid:d.cid,pid:d.pid});
  if(a==='retro-back'){
    var origin=window.evRetroOrigin;window.evRetroOrigin=null;
    if(origin&&origin.type==='reports'){return openLocalReports(origin.cid,origin.local);}
    return histModal(d.cid,d.pid);
  }
  if(a==='pick-retro-day'){if($('retro_date'))$('retro_date').value=d.day;document.querySelectorAll('.ev-calendar-date').forEach(function(e){e.classList.toggle('ev-toggle-active',e.dataset.day===d.day);});return;}
  if(a==='save-past-check'){
    var pastDate=$('retro_date').value, chosenStatus=$('retro_status').value, details=($('retro_details').value||'').trim();
    if(!pastDate||pastDate>=today())return showError('Escolha uma data anterior a hoje.');
    if(chosenStatus!=='GERAÇÃO NORMAL'&&!details)return showError('Informe os detalhes do status.');
    var pastPlant=plant(find(d.cid),d.pid);
    if(getDailyEntry(pastPlant,pastDate))return showError('Já existe monitoramento para essa data.');
    return await saveMonitoringWithPhoto(function(){return window.EnvitecWeb.registerPastCheck(d.pid,pastDate,chosenStatus,details);},t,d.pid,'monitoring',pastDate,function(){var origin=window.evRetroOrigin;window.evRetroOrigin=null;if(origin&&origin.type==='reports')openLocalReports(origin.cid,origin.local);else histModal(d.cid,d.pid);});
  }
  if(a==='edit-reg')return showError('Retificação de registro ainda não habilitada.');
  if(a==='del-reg')return showError('Exclusão desabilitada para preservar a auditoria.');
  if(a==='quick-an'){
    if(d.txt) $('an_text').value=d.txt;
    if(d.st) $('an_st').value=d.st;
    return;
  }
  if(a==='open-analise-modal')return analiseModal(d.cid,d.pid);
  if(a==='save-analise'){
    var selected=plant(find(d.cid),d.pid);
    if(!selected || !selected._activeOccurrence)return showError('Não existe ocorrência ativa. Atualize os dados.');
    var diagnosis=($('an_text').value||'').trim();
    if(!diagnosis)return showError('Informe o diagnóstico técnico.');
    if(d.analysisid){
      return await saveToSupabase(function(){return window.EnvitecWeb.editAnalysis(d.analysisid,d.version,diagnosis);},t,function(){closeModal();});
    }
    return await saveToSupabase(function(){return window.EnvitecWeb.registerDailyAnalysis(d.occid||selected._activeOccurrence.id,diagnosis);},t,function(){closeModal();});
  }
  if(a==='save-reg'){
    var target=plant(find(d.cid),d.pid),dateTxt=$('r_date').value;
    if(d.origkey)return showError('Alteração de checagem não habilitada.');
    var selectedDay=(state.selectedDate||today());
    var existingEntry=getDailyEntry(target,selectedDay);
    if(existingEntry && !(d.newfault==='1' && selectedDay===today()))return showError('Já existe checagem nessa data.');
    if(dateTxt && dateTxt.slice(0,10)!==selectedDay)return showError('A data do formulário mudou. Atualize o sistema.');
    var status=$('r_st').value, details=($('r_det').value||'').trim();
    if(status!=='GERAÇÃO NORMAL'&&!details)return showError('Informe os detalhes da ocorrência.');
    return await saveMonitoringWithPhoto(function(){return d.newfault==='1'?window.EnvitecWeb.registerNewFault(d.pid,selectedDay,status,details,true):(existingEntry&&status==='GERAÇÃO NORMAL'?window.EnvitecWeb.appendOperationalUpdate(d.pid,status,details,'new'):window.EnvitecWeb.registerCheck(d.pid,selectedDay,status,details));},t,d.pid,existingEntry?'update':'monitoring',selectedDay,function(){closeModal();});
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(!t)return;
  if(t.id==='ev_analysis_occ'){var c=document.querySelector('#modalRoot [data-action="save-analise"]');if(c)return analiseModal(c.dataset.cid,c.dataset.pid,t.value);}
  if(t.id==='ev_monitor_photo'){var status=$('ev_photo_selected');if(status)status.textContent=t.files&&t.files[0]?t.files[0].name:'';return;}
  if(t.id==='ev_dash_year'){state.expYear=Number(t.value);save();return rDash();}
  if(t.id==='ev_target_type'){
    if($('ev_existing_wrap'))$('ev_existing_wrap').style.display=t.value==='existing'?'block':'none';
    if($('ev_new_wrap'))$('ev_new_wrap').style.display=t.value==='new'?'block':'none';return;
  }
  if(t.matches('select[data-f="tipo"]')){
    var block=t.closest('.plant-block');
    if(block){
      var brandSel=block.querySelector('select[data-f="brand"]');
      var customWrap=block.querySelector('.brand-custom-wrap');
      if(brandSel){
        var cur=brandSel.value;
        var list=brandsFor(t.value);
        var next=list.indexOf(cur)>-1?cur:list[0];
        brandSel.innerHTML=options(list,next);
        if(customWrap){
          customWrap.style.display=next==='Outra'?'block':'none';
        }
      }
    }
  }
  if(t.matches('select[data-f="brand"]')){
    var block=t.closest('.plant-block');
    if(block){
      var customWrap=block.querySelector('.brand-custom-wrap');
      if(customWrap){
        customWrap.style.display=t.value==='Outra'?'block':'none';
        if(t.value==='Outra'){
          var inp=customWrap.querySelector('input');
          if(inp) inp.focus();
        }
      }
    }
  }
});
try{
  if(localStorage.getItem('sidebar_collapsed')==='1'){
    var sb = $('appSidebar');
    if(sb){
      sb.classList.add('collapsed');
      var btn = $('btnToggleSidebar');
      if(btn) btn.title = 'Expandir menu lateral';
    }
  }
}catch(err){}

render();
window.EnvitecWeb.unlock();
})();
</script>
</body>
</html>
